name: P2Pool CodeQL config

# Test code never ships in the node, and its fixed nonces, passwords and
# salts are test fixtures, not secrets. Unit tests live in their own
# `tests.rs` / `*_tests.rs` files so these paths cover them.
paths-ignore:
  - p2poolv2_tests
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/test_utils.rs"
  # The SAFA tool's integration tests and their fixed public vectors.
  - p2poolv2_safa/tests
  - "**/benches"
  - load-tests
