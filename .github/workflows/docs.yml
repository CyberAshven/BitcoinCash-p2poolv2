name: Docs

# Builds the mdBook site from docs/ (docs/book.toml, docs/SUMMARY.md) and
# uploads it as the github-pages artifact. Publishing is off unless the
# repository variable DOCS_PAGES is "true" and Settings > Pages > Source is
# "GitHub Actions"; it then publishes main's book.

on:
  push:
    branches: ["main", "alpha"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main", "alpha"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book:
    name: Build the docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdBook
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: mdbook@0.5.4

      - name: Build the book
        run: mdbook build docs

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  pages:
    name: Publish to GitHub Pages
    needs: book
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
