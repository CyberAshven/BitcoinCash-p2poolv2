name: Docs

# Builds the project site and uploads it as the github-pages artifact:
#
#   index.html, LICENSE-MIT  the landing page from website/
#   assets/                  the dashboard's shared stylesheets, fonts and
#                            logos it links, with their licence files
#   docs/                    the mdBook from docs/ (docs/book.toml,
#                            docs/SUMMARY.md)
#   404.html                 the mdBook's not-found page
#
# Publishing is off unless the repository variable DOCS_PAGES is "true" and
# Settings > Pages > Source is "GitHub Actions"; it then publishes main's
# site. website/README.md describes the landing page.

on:
  push:
    branches: ["main", "alpha"]
    paths:
      - "docs/**"
      - "website/**"
      - "p2poolv2_api/src/api/dashboard/assets/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main", "alpha"]
    paths:
      - "docs/**"
      - "website/**"
      - "p2poolv2_api/src/api/dashboard/assets/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book:
    name: Build the docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdBook
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: mdbook@0.5.4

      - name: Build the book
        run: mdbook build docs

      # The landing page links the shared assets where they sit in the
      # repository, so it renders from a checkout; the site serves them from
      # assets/ beside it. The workspace tests (style_guard.rs) check that
      # the page links nothing else outside itself.
      - name: Stage the site
        run: |
          set -euo pipefail
          assets=p2poolv2_api/src/api/dashboard/assets
          site=target/site
          rm -rf "$site"
          mkdir -p "$site/assets"
          sed "s#\.\./$assets/#assets/#g" website/index.html > "$site/index.html"
          cp website/LICENSE-MIT "$site/"
          cp "$assets"/*.css "$assets"/*.woff2 "$assets"/*.svg "$assets"/*.txt "$site/assets/"
          cp -R target/book "$site/docs"
          cp target/book/404.html "$site/404.html"
          if grep -n '\.\./' "$site/index.html"; then
            echo "::error file=website/index.html::the page links a file outside the published site"
            exit 1
          fi
          grep -o '"assets/[^"]*"' "$site/index.html" | tr -d '"' | sort -u |
            while read -r file; do
              test -f "$site/$file" || { echo "::error file=website/index.html::$file is not published"; exit 1; }
            done

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  pages:
    name: Publish to GitHub Pages
    needs: book
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
