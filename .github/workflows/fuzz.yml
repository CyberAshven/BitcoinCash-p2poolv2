name: Fuzz

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A separate workflow and target directory leave required Rust checks alone.
  fuzz-smoke-test:
    name: Decoder fuzz smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_TARGET_DIR: ${{ github.workspace }}/p2poolv2_lib/fuzz/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly

      # cargo-fuzz has no --locked option; validate before caching or building.
      - name: Validate fuzz lockfile
        run: cargo metadata --manifest-path p2poolv2_lib/fuzz/Cargo.toml --locked --format-version 1 > /dev/null

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: p2poolv2_lib/fuzz -> target
          shared-key: fuzz-nightly

      - name: Restore decoder corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: p2poolv2_lib/fuzz/corpus/wire_message_decode
          key: fuzz-corpus-${{ runner.os }}-wire_message_decode-v1-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.os }}-wire_message_decode-v1-

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz

      - name: Add repository corpus seeds
        run: |
          mkdir -p p2poolv2_lib/fuzz/corpus/wire_message_decode
          cp p2poolv2_lib/fuzz/seed_corpus/wire_message_decode/* p2poolv2_lib/fuzz/corpus/wire_message_decode/

      - name: Smoke test decoder (60 seconds)
        working-directory: p2poolv2_lib
        # The prebuilt cargo-fuzz defaults to musl, where AddressSanitizer cannot run.
        run: cargo fuzz run --target x86_64-unknown-linux-gnu wire_message_decode -- -max_total_time=60 -max_len=1310721 -rss_limit_mb=2048

      - name: Check fuzz lockfile stayed unchanged
        run: git diff --exit-code -- p2poolv2_lib/fuzz/Cargo.lock

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-smoke-wire-message-decode
          path: p2poolv2_lib/fuzz/artifacts/wire_message_decode/
          if-no-files-found: ignore
