name: Rust CI

on:
  push:
    branches: ["main", "alpha"]
  pull_request:
    branches: ["main", "alpha"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The terminal UI's views and models alone, as a ratatui program that
      # draws them from its own data depends on them.
      - name: Run clippy on the terminal UI without its clients
        run: cargo clippy -p p2poolv2_tui --all-targets --no-default-features -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-26.04
    # Line tables keep file and line numbers in backtraces, but not the full
    # debug info, which made the test build and its cache (3.6 GB packed) big
    # enough to fill the runner's disk.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0

      - name: Install latest nextest release
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run tests
        run: cargo nextest run --workspace

      # The run above loaded the dashboard in headless Chrome without
      # pictures. This one has the browser draw one page of each kind, for
      # a person to look at.
      - name: Draw the dashboard in headless Chrome
        env:
          DASHBOARD_SCREENSHOTS: ${{ runner.temp }}/dashboard-screenshots
        run: cargo test -p p2poolv2_api --lib browser

      - name: Keep the dashboard pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dashboard-screenshots
          path: ${{ runner.temp }}/dashboard-screenshots
          if-no-files-found: warn

      - name: Run sim-feature tests
        run: cargo nextest run -p p2poolv2_lib --features sim

      - name: Run the terminal UI's tests without its clients
        run: cargo nextest run -p p2poolv2_tui --no-default-features

  # The terminal UI on Windows, where its operators also run it. It builds
  # no RocksDB, so only secp256k1's flags are needed.
  tui-windows:
    name: Terminal UI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0

      - name: Install latest nextest release
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run tests
        shell: pwsh
        run: |
          $env:CFLAGS = '-DSECP256K1_STATIC -DENABLE_MODULE_ELLSWIFT'
          $env:CXXFLAGS = '-DSECP256K1_STATIC'
          cargo nextest run -p p2poolv2_tui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -p p2poolv2_tui -- --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  web:
    name: Web dashboard (WASM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p2poolv2_web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown

      # Trunk fetches the wasm-bindgen CLI matching Cargo.lock and wasm-opt.
      - name: Install trunk
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: trunk

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy for wasm32
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Build static assets
        run: trunk build --release

      # The app's only styling is the node's dashboard assets, bundled by
      # trunk. The stylesheet's font url()s are relative, so the fonts must
      # sit next to it in dist. The style guard in p2poolv2_api checks the
      # sources; this checks the bundle.
      - name: Check the bundled stylesheets resolve
        run: |
          set -eu
          ls dist/pico.min-*.css dist/dashboard-*.css dist/pages-*.css
          test -f dist/logo-horizontal-wt.svg
          urls=$(grep -oh 'url("[^"]*")' dist/dashboard-*.css dist/pages-*.css | sed 's/^url("//; s/")$//' | grep -v '^data:' || true)
          test -n "$urls"
          for url in $urls; do
            test -f "dist/$url" || { echo "dist/$url is missing"; exit 1; }
          done
          if find dist -name '*.css' ! -name 'pico.min-*.css' ! -name 'dashboard-*.css' ! -name 'pages-*.css' | grep -q .; then
            echo "dist has a stylesheet that is not a shared asset"; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: p2poolv2_web
          path: p2poolv2_web/dist

  # The SAFA covenant in libauth-rs's BCH 2026 VM (p2poolv2_safa). The test
  # job runs it too; this job keeps the covenant's result visible on its own.
  covenants:
    name: BCH Covenant Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0

      - name: Install latest nextest release
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run the covenant tests
        run: cargo nextest run -p p2poolv2_safa

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov,nextest
      # Without a cache every run rebuilds librocksdb-sys from C++ source
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Run coverage through nextest so it uses the same runner as the test
      # job. Plain `cargo test` runs the whole workspace in one process per
      # crate, which changes test semantics for anything touching process
      # state and can fail here while passing there.
      - name: Generate code coverage
        run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
      # This job compiles and runs PR code, including build scripts of newly
      # proposed dependency versions, so it holds no secrets. It only saves the
      # report; coverage-upload.yml sends it to Codecov from a workflow_run
      # that holds CODECOV_TOKEN but never executes PR code. That keeps the
      # token away from every PR, Dependabot's included, without skipping any.
      - name: Record pull request number
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s' "$PULL_REQUEST_NUMBER" > pull-request-number
      - name: Save coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            lcov.info
            pull-request-number
          # coverage-gate.yml compares PRs against the newest alpha report, so
          # alpha keeps its report long enough to survive quiet periods.
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
          if-no-files-found: error
