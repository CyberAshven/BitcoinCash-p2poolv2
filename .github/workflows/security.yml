name: Security

# Advisories land against unchanged code, so this cannot be a PR-only check.
on:
  push:
    branches: ["main", "alpha"]
  pull_request:
    branches: ["main", "alpha"]
  schedule:
    - cron: "24 6 * * *" # everyday at 06:24
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Licence, duplicate-version and source-registry policy. Deterministic: the
  # result only changes when a dependency changes, so this blocks.
  policy:
    name: cargo-deny (licences, bans, sources)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny

      - run: cargo deny check licenses bans sources

  # Vulnerability advisories, from the same tool and the same deny.toml.
  # Split out and non-blocking because a newly published RUSTSEC advisory can
  # turn this red overnight against unchanged code, which should not stop an
  # unrelated merge. The daily schedule above is what surfaces those.
  advisories:
    name: cargo-deny (advisories)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny

      - run: cargo deny check advisories

  # Semgrep community rules for Rust, committed secrets, these workflows and
  # the Dockerfiles: a second static check beside CodeQL, with rules CodeQL
  # does not have. A finding fails the job and goes to the repository's code
  # scanning alerts. A finding that is accepted is marked where it is, with a
  # nosemgrep comment and the reason beside it.
  #
  # One rule is left out: rust.lang.security.args.args flags every read of
  # the command line. This workspace reads it only to parse a tool's
  # options, never to decide what to trust.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.185.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan
        run: >-
          semgrep scan --metrics=off --error
          --config p/rust --config p/secrets
          --config p/github-actions --config p/dockerfile
          --exclude-rule rust.lang.security.args.args
          --sarif --output semgrep.sarif

      # The same scan for the job log. It leaves out the SARIF file the scan
      # above wrote, which would otherwise be scanned as a source file.
      - name: Findings
        if: failure()
        run: >-
          semgrep scan --metrics=off
          --config p/rust --config p/secrets
          --config p/github-actions --config p/dockerfile
          --exclude-rule rust.lang.security.args.args
          --exclude semgrep.sarif
          || true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
