name: Sim Integration Test

on:
  schedule:
    - cron: '24 3 * * *'   # every day at 03:24 UTC
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Failure scenario to run'
        required: false
        type: choice
        default: every
        options:
          - every
          - clean
          - restart-fast
          - restart-delayed
          - partition
          - late-miner
          - pruned-join
          - deep-fork-refused
          - shallow-fork-reorged
      node_count:
        description: 'Number of sim nodes'
        required: false
        default: '10'
      duration_seconds:
        description: 'Settle time after the scenario, in seconds'
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One swarm per failure scenario, so a failing run names the failure mode
  # that caused it. The matrix is built here rather than inline because a
  # manual dispatch can narrow it to a single scenario, and the matrix context
  # is not available to a job-level `if`.
  select-scenarios:
    name: Select scenarios
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Build scenario matrix
        id: select
        env:
          SELECTED: ${{ github.event.inputs.scenario || 'every' }}
        run: |
          set -euo pipefail
          # convergence_wait is the settle time AFTER the scenario heals;
          # restart-delayed needs the longest timeout because its node stays
          # down 330s to cross the 300s tip-age threshold. The swarm mines
          # Bitcoin Cash, so late-miner waits for twice Bitcoin Cash's
          # 100-share coinbase maturity (a share-chain rule the sim build
          # keeps); it runs time-compressed so that takes minutes, with five
          # more minutes of timeout than the others for the longer wait.
          # pruned-join is time-compressed too, so the swarm passes
          # the sim prune target (220 shares) and prunes before the join.
          # The fork scenarios launch split (fork_group_from 7 of the default
          # 10 nodes, so the zipf-weighted majority is nodes 0-6);
          # shallow-fork-reorged is the control for deep-fork-refused. They
          # raise hashrate so the minority group's ASERT target stays above
          # the easy clamp and it mines at the ideal rate.
          all='[
            {"scenario":"clean",           "convergence_wait":"300","timeout":25,"ideal_block_time":"5","shares_per_block":"1000","late_miner":"","fork_group_from":"","hashrate":""},
            {"scenario":"restart-fast",    "convergence_wait":"180","timeout":25,"ideal_block_time":"5","shares_per_block":"1000","late_miner":"","fork_group_from":"","hashrate":""},
            {"scenario":"restart-delayed", "convergence_wait":"180","timeout":40,"ideal_block_time":"5","shares_per_block":"1000","late_miner":"","fork_group_from":"","hashrate":""},
            {"scenario":"partition",       "convergence_wait":"180","timeout":30,"ideal_block_time":"5","shares_per_block":"1000","late_miner":"","fork_group_from":"","hashrate":""},
            {"scenario":"late-miner",      "convergence_wait":"60", "timeout":35,"ideal_block_time":"1","shares_per_block":"20",  "late_miner":"1","fork_group_from":"","hashrate":""},
            {"scenario":"pruned-join",     "convergence_wait":"60", "timeout":30,"ideal_block_time":"1","shares_per_block":"20",  "late_miner":"","fork_group_from":"","hashrate":""},
            {"scenario":"deep-fork-refused",   "convergence_wait":"30","timeout":30,"ideal_block_time":"1","shares_per_block":"20","late_miner":"","fork_group_from":"7","hashrate":"1e13"},
            {"scenario":"shallow-fork-reorged","convergence_wait":"60","timeout":20,"ideal_block_time":"1","shares_per_block":"20","late_miner":"","fork_group_from":"7","hashrate":"1e13"}
          ]'
          if [ "$SELECTED" = "every" ]; then
            matrix=$(echo "$all" | jq -c .)
          else
            matrix=$(echo "$all" | jq -c --arg s "$SELECTED" '[.[] | select(.scenario == $s)]')
          fi
          echo "Selected scenarios: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  sim:
    name: Sim Swarm (${{ matrix.scenario }})
    needs: select-scenarios
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false   # one failing scenario must not cancel the others
      matrix:
        include: ${{ fromJSON(needs.select-scenarios.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2

      # BCHN, the Bitcoin Cash node the swarm mines against, from its official
      # release tarball. The version and the per-architecture SHA-256 come
      # from docker/bchn/Dockerfile, which pins them from BCHN's signed
      # release notes, so CI and the Docker image run the same verified build.
      - name: Install BCHN
        run: |
          set -euo pipefail
          dockerfile=docker/bchn/Dockerfile
          version=$(sed -n 's/^ARG BCHN_VERSION=//p' "$dockerfile" | head -n 1)
          case "$(uname -m)" in
            x86_64)  arch=x86_64;  sum=$(sed -n 's/^ARG BCHN_SHA256_AMD64=//p' "$dockerfile") ;;
            aarch64) arch=aarch64; sum=$(sed -n 's/^ARG BCHN_SHA256_ARM64=//p' "$dockerfile") ;;
            *) echo "No BCHN release for $(uname -m)" >&2; exit 1 ;;
          esac
          if [ -z "$version" ] || [ -z "$sum" ]; then
            echo "BCHN version or checksum not found in $dockerfile" >&2
            exit 1
          fi
          tarball="bitcoin-cash-node-${version}-${arch}-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/v${version}/${tarball}"
          echo "${sum}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bchn"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bchn" --strip-components=1
          sudo install -m 0755 "$RUNNER_TEMP/bchn/bin/bitcoind" "$RUNNER_TEMP/bchn/bin/bitcoin-cli" /usr/local/bin/
          # The release bitcoind links libatomic (see the Dockerfile).
          if ! ldconfig -p | grep 'libatomic\.so\.1' > /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends libatomic1
          fi
          bitcoind --version

      - name: Run sim integration test
        env:
          SCENARIO: ${{ matrix.scenario }}
          NODE_COUNT: ${{ github.event.inputs.node_count || '10' }}
          CONVERGENCE_WAIT_SECONDS: ${{ github.event.inputs.duration_seconds || matrix.convergence_wait }}
          IDEAL_BLOCK_TIME: ${{ matrix.ideal_block_time }}
          SHARES_PER_BLOCK: ${{ matrix.shares_per_block }}
          LATE_MINER: ${{ matrix.late_miner }}
          FORK_GROUP_FROM: ${{ matrix.fork_group_from }}
          HASHRATE: ${{ matrix.hashrate }}
          # UNCLE_RATE_THRESHOLD stays at its 25% default. Killing nodes creates
          # forks, so this is the knob to raise if a failure scenario turns out
          # to be flaky -- raise it here rather than weakening the check itself.
        run: |
          set -o pipefail
          # Keep this log OUTSIDE the run dir: launching the swarm starts by
          # removing RUN_DIR, which unlinks the file tee is still writing to,
          # so a log written there never reaches the artifact.
          cargo run --release -p p2poolv2_tools --bin sim_harness -- nightly 2>&1 | tee /tmp/nightly-output.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sim-logs-${{ matrix.scenario }}
          path: |
            /tmp/p2pool-sim/
            /tmp/nightly-output.log
          retention-days: 7

  # The Bitcoin Cash payout tree against a real BCHN: a token share's coinbase
  # pays 623 of 700 payees through a two-level tree, the node's own executor
  # broadcasts it after 100 blocks, and BCHN must accept every node
  # transaction (regtest requires standard transactions, as mainnet does);
  # a no-token coinbase paying 3,000 miners directly must be a valid block.
  payout-tree-bchn:
    name: Payout tree on BCHN regtest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: payout-tree-production

      - name: Install latest nextest release
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest

      # The same verified BCHN release the sim swarm uses.
      - name: Install BCHN
        run: |
          set -euo pipefail
          dockerfile=docker/bchn/Dockerfile
          version=$(sed -n 's/^ARG BCHN_VERSION=//p' "$dockerfile" | head -n 1)
          sum=$(sed -n 's/^ARG BCHN_SHA256_AMD64=//p' "$dockerfile")
          if [ -z "$version" ] || [ -z "$sum" ]; then
            echo "BCHN version or checksum not found in $dockerfile" >&2
            exit 1
          fi
          tarball="bitcoin-cash-node-${version}-x86_64-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/v${version}/${tarball}"
          echo "${sum}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bchn"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bchn" --strip-components=1
          sudo install -m 0755 "$RUNNER_TEMP/bchn/bin/bitcoind" "$RUNNER_TEMP/bchn/bin/bitcoin-cli" /usr/local/bin/
          if ! ldconfig -p | grep 'libatomic\.so\.1' > /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends libatomic1
          fi
          bitcoind --version

      - name: Start BCHN regtest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bchn-regtest"
          bitcoind -regtest -daemon -server=1 -listen=0 -disablewallet=1 \
            -datadir="$RUNNER_TEMP/bchn-regtest" -rpcport=18443 \
            -acceptnonstdtxn=0 \
            -rpcuser=p2pool -rpcpassword=p2pool
          timeout 60s bitcoin-cli -regtest -datadir="$RUNNER_TEMP/bchn-regtest" -rpcport=18443 \
            -rpcuser=p2pool -rpcpassword=p2pool -rpcwait getblockchaininfo

      # Do not enable sim here: this job exercises production payout rules.
      # Both ignored tests mine on the same node, so nextest must serialize them.
      - name: Run the payout tree tests against BCHN
        env:
          P2POOL_TEST_BCHN_RPC_URL: http://127.0.0.1:18443
          P2POOL_TEST_BCHN_RPC_USER: p2pool
          P2POOL_TEST_BCHN_RPC_PASSWORD: p2pool
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          cargo nextest run --locked -p p2poolv2_tests --no-default-features \
            --run-ignored only -E 'test(bchn_regtest)' -j 1 \
            2>&1 | tee "$RUNNER_TEMP/payout-tree-bchn.log"

      - name: Stop BCHN regtest
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bchn-regtest/regtest/bitcoind.pid" ]; then
            bitcoin-cli -regtest -datadir="$RUNNER_TEMP/bchn-regtest" -rpcport=18443 \
              -rpcuser=p2pool -rpcpassword=p2pool stop
          fi

      - name: Upload payout tree logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: payout-tree-bchn-logs
          path: |
            ${{ runner.temp }}/bchn-regtest/regtest/debug.log
            ${{ runner.temp }}/payout-tree-bchn.log
          if-no-files-found: ignore
          retention-days: 7
