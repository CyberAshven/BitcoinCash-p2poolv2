[workspace]
members = [
    "bitcoindrpc",
    "p2poolv2_wallet",
    "p2poolv2_config",
    "p2poolv2_lib",
    "p2poolv2_node",
    "p2poolv2_cli",
    "p2poolv2_api",
    "p2poolv2_tests",
    "p2poolv2_sim",
    "p2poolv2_tools",
    "p2poolv2_daa",
    "p2poolv2_web",
    "p2poolv2_tui",
    "p2poolv2_netsim",
    "p2poolv2_safa",
    "p2poolv2_photon_payout",
]
resolver = "2"

[workspace.package]
version = "0.0.1-alpha"
edition = "2024"
authors = ["Kulpreet Singh<kp@opdup.com>"]
license = "MIT OR Apache-2.0"
description = "P2Poolv2 is a peer-to-peer Bitcoin mining pool where miners coordinate directly and verify their rewards without centralized operators"
readme = "README.adoc"
homepage = "https://github.com/CyberAshven/BitcoinCash-p2poolv2"
repository = "https://github.com/CyberAshven/BitcoinCash-p2poolv2"
keywords = ["bitcoin", "mining", "pool", "p2p"]
categories = ["cryptography::cryptocurrencies"]
exclude=["tests"]
rust-version = "1.88"
publish = false

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"

[profile.bench]
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

[workspace.dependencies]
libauth = { git = "https://github.com/mainnet-pat/libauth-rs", rev = "be3ed16396c9eb9c0e57343474d36079a37c8dae" }
libp2p = { version = "0.56", features = [
    "tcp",
    "dns",
    "tokio",
    "noise",
    "yamux",
    "identify",
    "macros",
    "kad",
    "ping",
    "request-response",
] }
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = { version = "0.2.3" }
config = { version = "0.15", default-features = false, features = ["toml"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive", "env"] }
hex = "0.4.3"
# Held at the digest 0.10 generation on purpose. hmac 0.13 / sha2 0.11 move to
# digest 0.11, but libp2p-identity still pins the older stack through
# ed25519-dalek, hkdf and curve25519-dalek, so upgrading compiles both and adds
# seven duplicate crates for no functional gain. Revisit when libp2p-identity
# moves to digest 0.11. The known-answer tests in p2poolv2_lib/src/auth.rs pin
# the output, so the upgrade is safe whenever it happens.
hmac = "0.12"
sha2 = "0.10"
rocksdb = { version = "0.25.0", features = ["multi-threaded-cf"] }
async-trait = "0.1.83"
thiserror = "2.0.8"
serde_json = "1.0.135"
zmq = "0.10"
bitcoin = { version = "0.32.5", features = ["serde", "rand"] }
bitcoinconsensus = { version = "0.106.0" }
# Bitcoin Cash Schnorr share signatures; expose-field gives the quadratic-residue
# check that scheme needs.
k256 = { version = "0.14.0", default-features = false, features = ["arithmetic"] }
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7.15", features = ["codec"] }
tokio-stream = "0.1.17"
bitcoindrpc = { path = "bitcoindrpc" }
p2poolv2_wallet = { path = "p2poolv2_wallet" }
p2poolv2_config = { path = "p2poolv2_config" }
p2poolv2_api = { path = "p2poolv2_api" }
p2poolv2_lib = { path = "p2poolv2_lib", features = ["test-utils"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls"] }
mockall = "0.15"
mockall_double = "0.3.1"
tempfile = "3.15.0"
tokio-test = "0.4.3"
wiremock = "0.6.2"
dashmap = "6"
uint = "0.10"
criterion = { version = "0.8", features = ["html_reports"] }
tower = "0.5"
rand = "0.10"
temp-env = "0.3.6"
test-log = { version = "0.2.17", features = ["trace"] }
