# P2Poolv2 for Bitcoin Cash, as the Docker image and docker/docker-compose.yml
# run it: a regtest node with BCHN on 127.0.0.1.
#
# Under compose, NETWORK and BCH_SHARE_CHAIN in docker/.env override chain,
# bitcoin_cash_network, bch_share_chain and the store path below. For chipnet
# or mainnet, copy this file to config.toml, set the values marked "chipnet or
# mainnet", and set P2POOL_CONFIG=config.toml in docker/.env. Mainnet and
# chipnet run the same rules; only the network switch differs.

[network]
listen_address = "/ip4/0.0.0.0/tcp/6884"
# Share chain peers to dial at startup and keep reconnecting to, as
# "/ip4/<address>/tcp/<port>". Bitcoin Cash has no DNS seeds yet, so on
# chipnet or mainnet list at least one node of the share chain you join;
# without one the node only waits for peers to dial it.
dial_peers = []
# Always off on Bitcoin Cash: the built-in seeds are Bitcoin nodes.
# dns_seed = true
max_pending_incoming = 10
max_pending_outgoing = 10
max_established_incoming = 50
max_established_outgoing = 50
# Two, not one: room for an inbound and an outbound connection when two
# nodes dial each other at once. More only duplicates traffic -- libp2p
# multiplexes every protocol over a single connection.
max_established_per_peer = 2
max_workbase_per_second = 10
max_userworkbase_per_second = 10
max_miningshare_per_second = 100
max_inventory_per_second = 100
max_transaction_per_second = 100
max_requests_per_second = 100
dial_timeout_secs = 30
# Address to advertise to peers when the node is behind NAT.
# external_address = "/ip4/203.0.113.1/tcp/6884"

[store]
# Compose sets /p2poolv2/data/<NETWORK>-<BCH_SHARE_CHAIN> instead.
path = "/p2poolv2/data/store.db"
pplns_ttl_days = 7

[stratum]
hostname = "0.0.0.0"
port = 3333
start_difficulty = 10000
minimum_difficulty = 100
# Highest difficulty a miner gets, also when it asks for more with d= or
# mining.suggest_difficulty. Default 4294967296 (2^32), about 5.5 EH/s at one
# share every 3.33 seconds.
# maximum_difficulty = 4294967296
# Pool operating mode: "p2poolv2" (share chain) or "hydrapool"
# (standalone PPLNS, no share chain). Default p2poolv2.
# mode = "p2poolv2"

# Bitcoin Cash: templates without SegWit rules, CashAddr payout addresses,
# canonical transaction order.
chain = "bitcoin-cash"
# "mainnet", "chipnet" or "regtest". Under compose, NETWORK sets it.
bitcoin_cash_network = "regtest"
# "mini" (share target 256 times easier, for small miners) or "main".
# Under compose, BCH_SHARE_CHAIN sets it.
bch_share_chain = "mini"

# Share address owning every share this node mines: a p2pool: (mainnet),
# tp2pool: (chipnet) or rp2pool: (regtest) address made from a P2PKH key in
# your own wallet with `p2poolv2_cli bch-share-address`. Leave it unset when
# every miner sends its own p2p=<share address> in the Stratum password, as
# the regtest miner does. A miner sending a different p2p= is rejected.
# There is deliberately no default: an address published here would own the
# shares of everyone who copied this file.
# miner_address = "rp2pool:q..."

# A CashAddr for this network. Only Hydrapool mode pays it; a share chain
# node needs one that parses. chipnet or mainnet: use your own bchtest: or
# bitcoincash: address.
bootstrap_address = "bchreg:qqzldt8u5mafprrw6uljppyqg30uhl97ey890dqm34"

# Every Bitcoin Cash node donates 1% (100 basis points) of each block it
# finds to bitcoincash:qze95tc2dqrnltvxfa5yhunwx5952f34fvw4g6365k (the same key
# under bchtest: and bchreg:). Set donation to change it, 0 to opt out. A
# miner's login may choose its own with donation=<percent>, which this
# setting never overrides (docs/miner-options.md).
# donation = 100
# A public pool's own cut, after the donation: 100 basis points (1%) when
# fee_address is set without fee. The donation and the fee may each be at
# most 1000 basis points (10%); peers reject shares above that.
# fee_address = "bchreg:q..."
# fee = 100

# BCHN's ZMQ hashblock endpoint, as docker-compose.yml publishes it.
zmqpubhashblock = "tcp://127.0.0.1:28332"

# Stratum V2 next to Stratum V1. Without the authority keys below, frames are
# unencrypted, which only suits localhost or a trusted LAN; this container
# listens on every interface, so set the keys before opening the port.
# sv2_port = 3336
# sv2_authority_public_key = "9b..."
# Keep the secret out of the file: P2POOL_STRATUM__SV2_AUTHORITY_SECRET_KEY
# sv2_authority_secret_key = "..."

# Ignored on Bitcoin Cash (derived from bitcoin_cash_network) but required.
network = "regtest"
# Version rolling mask offered to miners: the 16 general purpose bits of
# BIP 320, which ASIC firmware rolls (BIP 310 negotiation).
version_mask = "1fffe000"
# A new regtest share chain never looks current: its genesis share is old.
# chipnet or mainnet, joining a running share chain: set true, so miners
# connect only once the node has synced.
wait_for_chain_sync = false
# Tags the coinbases this node builds; not part of consensus. Max 16 bytes.
pool_signature = "P2Poolv2"

[bitcoinrpc]
# BCHN's RPC, published on the host's loopback by docker-compose.yml.
# chipnet: http://127.0.0.1:48332, mainnet: http://127.0.0.1:8332.
url = "http://127.0.0.1:18443"
username = "p2pool"
password = "p2pool"

# Extra BCHN nodes a found block also goes to, beside [bitcoinrpc]. Optional.
# Each gets the block from its own task, sent again after a connection error
# or time-out for up to two minutes, so a block does not depend on one node.
# Repeat the table for more nodes.
# [[submit_nodes]]
# url = "http://bchn-backup.example:8332"
# username = "p2pool"
# password = "p2pool"

[logging]
file = "/p2poolv2/logs/p2pool.log"
console = true
level = "info"
# Pool, user and worker stats are dumped for consumption by stats tools
stats_dir = "/p2poolv2/logs/stats"

[api]
hostname = "0.0.0.0"
port = 46884
# Optional login for the API and dashboard. auth_token is salt$hmac from
# `p2poolv2_cli gen-auth <user> <password>`.
# auth_user = "admin"
# auth_token = "..."
# Open the dashboard and read-only share chain routes to anyone; /metrics,
# /peers, /blocked_ips and /jd_prepare keep the login.
# public_dashboard = false
# Serve a self-hosted frontend build from this folder.
# web_root = "/srv/p2pool-frontend"
