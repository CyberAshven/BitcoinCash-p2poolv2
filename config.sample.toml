# P2Poolv2 on Bitcoin Cash: a chipnet node, next to a BCHN chipnet node on
# this computer. For mainnet set bitcoin_cash_network = "mainnet", point
# [bitcoinrpc] at BCHN's mainnet RPC (port 8332) and use bitcoincash:
# payout and p2pool: share addresses. docs/bch-quickstart.md walks through
# it. config-bitcoin.sample.toml is the Bitcoin sample kept from upstream.

[network]
# Where peers reach this node's share chain.
listen_address = "/ip4/0.0.0.0/tcp/6884"
# Share chain peers to dial at startup and keep reconnecting to. A Bitcoin
# Cash node finds peers only here: there are no Bitcoin Cash DNS seeds yet,
# and dns_seed is ignored and always off on chain = "bitcoin-cash".
# dial_peers = ["/ip4/203.0.113.1/tcp/6884"]
max_pending_incoming = 10
max_pending_outgoing = 10
max_established_incoming = 50
max_established_outgoing = 50
# Two, not one: room for an inbound and an outbound connection when two
# nodes dial each other at once. More only duplicates traffic -- libp2p
# multiplexes every protocol over a single connection.
max_established_per_peer = 2
max_workbase_per_second = 10
max_userworkbase_per_second = 10
max_miningshare_per_second = 100
max_inventory_per_second = 100
max_transaction_per_second = 100
max_requests_per_second = 100
dial_timeout_secs = 30
# Optional external address for nodes behind NAT. If set, this address
# is advertised to peers instead of auto-detecting from identify observations.
# external_address = "/ip4/203.0.113.1/tcp/6884"

[store]
path = "./store.db"
pplns_ttl_days = 7

[stratum]
# Mine Bitcoin Cash: BCHN templates, CashAddr payouts, the Bitcoin Cash
# share chain.
chain = "bitcoin-cash"
# "mainnet", "chipnet", "scalenet" or "regtest". The node refuses to start
# unless [bitcoinrpc] is BCHN on this network.
bitcoin_cash_network = "chipnet"
# "mini" (share target 256 times easier, for small miners and test networks)
# or "main". Every node on one share chain must use the same one.
bch_share_chain = "mini"
hostname = "0.0.0.0"
port = 3333
# Difficulty a new miner starts at, and the lowest vardiff gives one. A
# miner's difficulty never goes above the share difficulty of its job (4 on
# the mini chain at its easiest), so small values suit chipnet's CPU miners
# and Bitaxes; vardiff raises it for ASICs.
start_difficulty = 1000
minimum_difficulty = 1
# Highest difficulty a miner gets, also when it asks for more with d= or
# mining.suggest_difficulty. Default 4294967296 (2^32), about 5.5 EH/s at one
# share every 3.33 seconds.
# maximum_difficulty = 4294967296
# Pool operating mode: "p2poolv2" (share chain) or "hydrapool"
# (standalone PPLNS, no share chain). Default p2poolv2.
# mode = "p2poolv2"
# Share address owning every share this node mines: a CashAddr share address
# (p2pool: on mainnet, tp2pool: on chipnet, sp2pool: on scalenet, rp2pool: on
# regtest), not a payout address. Make one from your own wallet's P2PKH
# address with `p2poolv2_cli bch-share-address --network chipnet bchtest:q...`.
# In p2poolv2 mode a share needs an owner, so a miner that does not send
# p2p=<share address> in its stratum password gets this address instead.
# Leave it unset only if every one of your miners sends p2p=; otherwise
# they are rejected at authorize.
# Not valid with mode = "hydrapool", which has no share chain.
#
# Set this to YOUR OWN share address before enabling it. There is
# deliberately no default: any address published here would own the shares
# of everyone who copied this file, and a placeholder would silently burn
# them.
#
# Note a configured address is authoritative, so a miner that sends a
# different p2p=<address> is rejected as a conflict. Set this only if you
# want every share to belong to the node.
# miner_address = "tp2pool:q..."
# The payout address for the first jobs, before the share chain has shares.
# Replace it with your own bchtest: (chipnet) or bitcoincash: (mainnet)
# address. This one is the P2Poolv2 donation address on chipnet.
bootstrap_address = "bchtest:qze95tc2dqrnltvxfa5yhunwx5952f34fv28vandn2"
# Each block this node finds donates 100 basis points (1%) by default to
# the P2Poolv2 Bitcoin Cash address
# bitcoincash:qze95tc2dqrnltvxfa5yhunwx5952f34fvw4g6365k (the same key under
# bchtest: and bchreg:). Set donation to raise or lower it, or to 0 to opt
# out. It is the default for miners whose login does not choose their own:
# each miner may with donation=<percent>, 0 to 10 in steps of 0.5, in the
# SV1 username or password or the SV2 identity (docs/miner-options.md), and
# this setting never overrides that choice. donation_address may be left
# out; if set it must be that same address, because the share chain rejects
# a Bitcoin Cash donation paid anywhere else.
# donation = 100
# A public pool operator's own cut, taken after the donation. The donation
# and the fee may each be at most 1000 basis points (10%); peers reject shares
# above that.
# fee_address = "bchtest:q..."
# In basis points, 1% = 100 basis points. Default 100 (1%) when fee_address
# is set; 0 when it is not.
# fee = 100
# A JSON file of the covenant tokens this node merge-mines for its miners
# (docs/bch-auxpow.md, "Merge-mining tokens on a public node"). Each miner's
# jobs then carry a root of their own token leaves, with their donation and
# the fee above as each win's cut; the node re-reads the file when it
# changes. No token is deployed yet, so leave it unset.
# merge_mining_tokens = "merge-tokens.json"
# BCHN's ZMQ block notifications: start BCHN with
# -zmqpubhashblock=tcp://127.0.0.1:28332.
zmqpubhashblock = "tcp://127.0.0.1:28332"
# Stratum V2 listen port. Absent means the node does not open an SV2 socket.
# Local frames are unencrypted, so keep it on localhost or a trusted LAN.
# A Mining connection opens standard or extended channels with
# user_identity "<payout address>.<worker>"; its shares belong to
# miner_address. Without miner_address, a miner appends its own share
# address as in the SV1 password: "<payout address>.<worker>,p2p=<address>".
# Job Declaration connections are served too. Bitcoin Cash jobs include one
# AuxPoW output.
# sv2_port = 3336
# Noise encryption for Stratum V2, signed by your authority key. Set both
# keys, in the Stratum V2 reference implementation's text form, to require
# the encrypted handshake on every SV2 connection; miners pin the public key.
# Make the keys with an external tool (this node never generates keys) and
# prefer the env var P2POOL_STRATUM__SV2_AUTHORITY_SECRET_KEY for the secret.
# sv2_authority_public_key = "9b..."
# sv2_authority_secret_key = "..."
# Seconds each Noise certificate stays valid. Default 3600.
# sv2_cert_validity_secs = 3600
# Where block templates come from. Default "rpc": getblocktemplate from the
# node in [bitcoinrpc]. "sv2" takes them from a Stratum V2 Template Provider
# (Template Distribution Protocol) and sends found blocks back to it;
# [bitcoinrpc] is still required, to check each template's parent, validate
# shares and take blocks the provider cannot.
# template_source = "rpc"
# HOST:PORT of the Template Provider, with template_source = "sv2".
# template_provider_address = "127.0.0.1:8442"
# The provider's authority public key (same text form as above). Pinning it
# runs the Noise handshake; it is required unless the provider is on this
# computer (a loopback address).
# template_provider_authority_public_key = "9b..."
# Version rolling mask offered to miners (BIP 310 negotiation): the 16 general
# purpose bits of BIP 320, 0x1fffe000, which ASIC firmware rolls on Bitcoin
# Cash as on Bitcoin. It is the code default and what Stratum V2 channels allow
# (version_rolling_allowed). Bitcoin Cash has not adopted BIP 323, whose wider
# mask 1fffffe0 also hands out bits 5 to 12.
version_mask = "1fffe000"
# The PPLNS payout window is a share chain rule, not configured: each
# coinbase pays the shares holding the last 3 BCH blocks of work (by the
# paying block's own difficulty) behind a 100-share maturity; see
# docs/architecture/payout-distribution.md.
# Add a pool signature, if you want. Comment out the line if you want
# to mine anonymous blocks. This signature is only used to show others
# how large your pool is, if you are running private, there is no need
# to add a pool signature. Maximum length 16 bytes.
# It only tags the coinbases this node builds. It is not a share-chain rule:
# peers read each block's signature from its own coinbase, so nodes with
# different signatures, or none, still accept each other's shares.
pool_signature = "P2Poolv2"
# Maximum concurrent stratum connections (default: 90% of OS file descriptor limit)
# max_connections = 1000

[bitcoinrpc]
# BCHN's RPC. Its default ports: 48332 on chipnet, 8332 on mainnet, 38332 on
# scalenet. Prefer the env vars P2POOL_BITCOINRPC__USERNAME and
# P2POOL_BITCOINRPC__PASSWORD for the credentials.
url = "http://127.0.0.1:48332"
username = "p2pool"
password = "p2pool"

# Extra BCHN nodes a found block also goes to, beside [bitcoinrpc]. Optional.
# Each gets the block from its own task, sent again after a connection error
# or time-out for up to two minutes, so a block does not depend on one node.
# Repeat the table for more nodes.
# [[submit_nodes]]
# url = "http://bchn-backup.example:48332"
# username = "p2pool"
# password = "p2pool"

[logging]
# Specify a file path for the log file, if no log file is specified, console logging will be used
file = "./logs/p2pool.log"
console = true
level = "info"
# Pool, user and worker stats are dumped for consumption by stats tools
stats_dir = "./logs/stats"

[api]
hostname = "127.0.0.1"
port = 46884
# Optional authentication credentials
# auth_user = "admin"
# auth_token is of the format salt:password-hmac. Use can p2poolv2_cli gen-auth to generate a token.
# auth_token = "your_secret_token"
# auth_password is the raw password for p2poolv2_cli client auth only. Do not set on server config.
# auth_password = "your_password"
# Enable permissive CORS (careful with this; allows any origin)
# cors_allowed = false
# Show the dashboard (/dashboard), the web_root frontend and the read-only
# share chain routes they read to anyone who can reach this port, for a
# public node. /metrics, /peers, /blocked_ips and /jd_prepare keep requiring
# auth_user. Default false: everything asks for the API login.
# public_dashboard = false
# Serve a self-hosted frontend: a folder with its build (index.html plus its
# files, from TypeScript, Rust/WASM or anything that builds to static files).
# It gets every path no API route takes and reads the same JSON API.
# web_root = "/srv/p2pool-frontend"
