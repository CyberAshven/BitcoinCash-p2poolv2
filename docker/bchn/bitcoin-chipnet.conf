# Bitcoin Cash Node, chipnet, for the P2Poolv2 Docker stack.
#
# Chipnet runs the next network upgrade's rules ahead of mainnet. P2Poolv2
# runs the same rules on chipnet and mainnet; only the network switch differs.
#
# No RPC password here: entrypoint.sh adds one at start, BCHN_RPC_PASSWORD
# or a random one made on first start, and the compose stack hands it to
# P2Poolv2. The stack publishes the RPC port on the host's loopback only.

chipnet=1
server=1
printtoconsole=1
# The pool needs templates, not a wallet.
disablewallet=1

[chip]
rpcuser=p2pool
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0

# P2Poolv2 waits for new blocks here.
zmqpubhashblock=tcp://0.0.0.0:28332

# Keep about 2 GB of blocks instead of the whole chain. P2Poolv2 only asks for
# templates and submits blocks; remove the line to keep a full archive.
prune=2000
