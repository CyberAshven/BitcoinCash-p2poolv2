# Bitcoin Cash Node, mainnet, for the P2Poolv2 Docker stack.
#
# Same rules as chipnet; only the network switch differs.
#
# No RPC password here: entrypoint.sh adds one at start, BCHN_RPC_PASSWORD
# or a random one made on first start, and the compose stack hands it to
# P2Poolv2. The stack publishes the RPC port on the host's loopback only.

server=1
printtoconsole=1
# The pool needs templates, not a wallet.
disablewallet=1

[main]
rpcuser=p2pool
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0

# P2Poolv2 waits for new blocks here.
zmqpubhashblock=tcp://0.0.0.0:28332

# Keep about 10 GB of blocks instead of the whole chain. P2Poolv2 only asks
# for templates and submits blocks; remove the line to keep a full archive.
prune=10000

# Ample room for the dbcache during the first sync; lower it on a small host.
dbcache=2048
