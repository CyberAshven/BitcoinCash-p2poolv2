# Bitcoin Cash Node, regtest, for the P2Poolv2 Docker dev stack.
#
# Regtest only: the RPC login below is public, and the stack publishes the
# RPC port on the host's loopback interface only.

regtest=1
server=1
printtoconsole=1

[regtest]
rpcuser=p2pool
rpcpassword=p2pool
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0

# P2Poolv2 waits for new blocks here.
zmqpubhashblock=tcp://0.0.0.0:28332

# getblocktemplate refuses work with "Bitcoin is not connected!" while the
# node has no peers, on regtest too. A dev chain has no peers to find.
allowunconnectedmining=1

# A node whose tip is older than maxtipage counts as in initial block download,
# and getblocktemplate then answers "Bitcoin is downloading blocks...". A dev
# chain left stopped for a day would stall the stack, so regtest never counts
# its tip as stale here.
maxtipage=2000000000
