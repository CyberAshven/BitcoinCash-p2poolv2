# Compose file for running additional p2poolv2 nodes against the shared
# BCHN started by docker-compose.yml.
#
# Usage:
#   # First, start the shared infrastructure (BCHN + default node):
#   docker compose up -d
#
#   # Then start additional nodes, each with its own .env and project name.
#   # .env.node2.sample is a regtest second node that dials the first:
#   cp .env.node2.sample .env.node2
#   docker compose -f docker-compose.node.yml -p node2 --env-file .env.node2 up -d
#
#   # To stop an additional node:
#   docker compose -f docker-compose.node.yml -p node2 down
#
# Note: p2poolv2 uses host networking (see docker-compose.p2poolv2.yml).
# All nodes share the same host ports - ensure port variables don't conflict.
# Each project gets its own store volume, so each node keeps its own share
# chain copy.

services:
  p2poolv2:
    extends:
      file: docker-compose.p2poolv2.yml
      service: p2poolv2

volumes:
  p2poolv2_data:
  # The shared BCHN's RPC password (chipnet and mainnet), from the stack
  # docker-compose.yml starts, whose project is named p2poolv2. Set
  # P2POOL_BITCOINRPC__PASSWORD in this node's .env to use another BCHN.
  bchn_rpc:
    external: true
    name: p2poolv2_bchn_rpc
