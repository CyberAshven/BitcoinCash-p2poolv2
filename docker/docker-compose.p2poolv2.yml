# Base p2poolv2 service definition, extended by docker-compose.yml and
# docker-compose.node.yml. Do not run this file directly.
#
# IMPORTANT: p2poolv2 uses host networking (network_mode: host) because Docker's
# bridge NAT adds an extra NAT layer that breaks inbound P2P connections without
# additional port forwarding or libp2p configuration for the Docker bridge.
# Host networking sidesteps this by binding directly to host interfaces.
# This only works on Linux.
#
# With host networking:
#   - p2poolv2 binds directly to host ports (no port mapping)
#   - BCHN's RPC and ZMQ are reached on 127.0.0.1, where docker-compose.yml
#     publishes them (not by the Docker DNS name 'bchn')
#   - the regtest miner connects to 127.0.0.1 too, so it uses host networking
#
# Run with: docker compose up -d p2poolv2

services:
  p2poolv2:
    image: p2poolv2:latest
    build:
      context: ..
      dockerfile: docker/p2poolv2/Dockerfile
    env_file: .env
    environment:
      # Nested config keys use `__` as the separator so that single
      # underscores stay part of a field name. P2POOL_CONFIG is read by clap
      # rather than the config crate, so it keeps a single underscore.
      #
      # The stack is Bitcoin Cash. NETWORK from .env is the single place a
      # compose deployment picks its network. It already selects BCHN's config
      # file in docker-compose.yml, so driving bitcoin_cash_network and the
      # store directory from it too is what keeps p2poolv2 and BCHN on the
      # same network.
      #
      # This overrides chain, bitcoin_cash_network and bch_share_chain in the
      # mounted config.toml. NETWORK is required rather than defaulted,
      # because a default would quietly put a deployment on one network while
      # its config said another. The store directory also names the share
      # chain, because main and mini are different chains.
      - P2POOL_STRATUM__CHAIN=bitcoin-cash
      - P2POOL_STRATUM__BITCOIN_CASH_NETWORK=${NETWORK:?NETWORK must be set in .env, see docker/.env.sample}
      - P2POOL_STRATUM__BCH_SHARE_CHAIN=${BCH_SHARE_CHAIN:-mini}
      - P2POOL_STORE__PATH=/p2poolv2/data/${NETWORK}-${BCH_SHARE_CHAIN:-mini}
      - P2POOL_CONFIG=/etc/p2poolv2/config.toml
      - P2POOL_STRATUM__PORT=${P2POOL_STRATUM_PORT:-3333}
      - P2POOL_API__PORT=${P2POOL_API_PORT:-46884}
      - P2POOL_NETWORK__LISTEN_ADDRESS=/ip4/${P2POOL_P2P_HOST:-0.0.0.0}/tcp/${P2POOL_P2P_PORT:-6884}
      # Passed through only when set, so platforms that inject the BCHN
      # endpoint (Umbrel and similar) can, while a deployment that does not set
      # it keeps whatever its mounted config.toml says. Do not give this a
      # default: that would force every deployment onto one endpoint.
      - P2POOL_BITCOINRPC__URL
    network_mode: host
    volumes:
      - p2poolv2_data:/p2poolv2
      - ../${P2POOL_CONFIG:-config-docker.sample.toml}:/etc/p2poolv2/config.toml:ro
    # The image's own healthcheck asks port 46884; this one follows
    # P2POOL_API_PORT. It needs /health to answer without a login: leave
    # auth_user unset or set public_dashboard = true.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${P2POOL_API_PORT:-46884}/health"]
      interval: 5s
      timeout: 2s
      start_period: 15s
      retries: 6
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  p2poolv2_data:
